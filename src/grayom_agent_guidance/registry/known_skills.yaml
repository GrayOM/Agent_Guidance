- id: trailofbits-skills
  name: Trail of Bits Skills
  type: skill
  source: local_registry
  github_url: https://github.com/trailofbits/skills
  official: false
  supported_agents: [codex, claude_code]
  # Verified at the pinned ref 82fe8226, not at the default branch. configuration_audit was
  # claimed here on the strength of `firebase-apk-scanner` and is withdrawn: scanning an APK
  # for Firebase misconfigurations is not the baseline review of servers, network gear and
  # databases that the question asks about, so the claim was the same over-reach it was meant
  # to fix. Nothing in this repository covers that, and it now reads as uncovered.
  capabilities: [
    security_analysis, source_analysis, vulnerability_research, reporting,
    web_security_testing,
  ]
  permissions: [filesystem_read, shell, subprocess, external_download]
  context_cost: 3
  quality_score: 88
  install_paths: [user_skills/trailofbits-skills--*]
  install_method:
    kind: git_skills
    repository: https://github.com/trailofbits/skills
    ref: 82fe8226252622fa807643bdca1710901198553a
    # Curated from all 83 published Skills at this ref, read one by one. Automatic selection
    # ranks by how much of the requested vocabulary a Skill uses, which cannot tell a
    # general scanner from one scoped to a platform nobody asked about — measured, and no
    # text signal separates them. The repository's own breadth is the problem: it also
    # carries smart-contract scanners for six chains, sixteen fuzzing Skills, a Trailmark
    # tool suite, Lean proofs and a Culture Index survey reader. Only the Skills that serve
    # this entry's declared capabilities are offered to selection; the mode limit and the
    # group share still apply on top.
    subpaths:
      # Understanding and preparing a target
      - plugins/audit-context-building/skills/audit-context-building
      - plugins/building-secure-contracts/skills/audit-prep-assistant
      - plugins/building-secure-contracts/skills/code-maturity-assessor
      # Static analysis and its output
      - plugins/static-analysis/skills/semgrep
      - plugins/static-analysis/skills/codeql
      - plugins/static-analysis/skills/sarif-parsing
      - plugins/semgrep-rule-creator/skills/semgrep-rule-creator
      # Language-specific source review
      - plugins/c-review/skills/c-review
      - plugins/rust-review/skills/rust-review
      # Finding, confirming and reporting
      - plugins/differential-review/skills/differential-review
      - plugins/variant-analysis/skills/variant-analysis
      - plugins/fp-check/skills/fp-check
      - plugins/vulnerability-triage-brocards/skills/vulnerability-triage-brocards
      - plugins/post-patch-validation/skills/post-patch-validation
      # Dependencies, CI and captured web traffic
      - plugins/supply-chain-risk-auditor/skills/supply-chain-risk-auditor
      - plugins/agentic-actions-auditor/skills/agentic-actions-auditor
      - plugins/burpsuite-project-parser/skills/burpsuite-project-parser
  security_metadata:
    shell_execution: true
    subprocess: true
    external_download: true
    filesystem_write: true
  maintenance_metadata:
    status: ACTIVE
    last_verified: "2026-10-02"
    license: CC-BY-SA-4.0

