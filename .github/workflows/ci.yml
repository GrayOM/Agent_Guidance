name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps
      - run: python -m compileall -q src tests
      - run: python -m pytest -q --cov=grayom_agent_guidance --cov-fail-under=70

  quality-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps
      - run: ruff check src tests
      - run: mypy src/grayom_agent_guidance/models src/grayom_agent_guidance/runtime
      - run: bandit -q -r src
      - run: pip-audit
      - run: python scripts/release_check.py
      - run: python -m build
      - run: python -c "import glob,subprocess,sys; subprocess.check_call([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',glob.glob('dist/*.whl')[0]])"
      - run: grayom --version
      - run: grayom --help
