<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240" role="img" aria-label="GrayOM eye">
  <title>GrayOM</title>
  <!-- No background rectangle: the README shows this on GitHub, which serves the page in a
       light or a dark theme, and a dark card painted behind the eye reads as a mistake in the
       light one. Every colour below holds up against either.

       The lids are deliberately not mirror images. An almond closed by two identical curves
       reads as a lens or a fish, which is what the previous logo did; an eye has an upper lid
       that rises further than the lower one falls, so the upper curve peaks 100px above the
       corners and the lower one drops 78.

       The shape is defined once and used twice, as the clip for the iris and as the stroked
       lid. Writing the same path out twice let the two drift apart by a few pixels. -->
  <defs>
    <path id="eye" d="M 28 134 C 92 34 308 34 372 134 C 308 212 92 212 28 134 Z"/>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#48d2f4"/>
      <stop offset="1" stop-color="#7557f5"/>
    </linearGradient>
    <clipPath id="lid">
      <use href="#eye"/>
    </clipPath>
  </defs>

  <g clip-path="url(#lid)">
    <circle cx="200" cy="128" r="56" fill="url(#iris)"/>
    <circle cx="200" cy="128" r="23" fill="#07091c"/>
    <circle cx="217" cy="112" r="9" fill="#f7f8ff"/>
  </g>
  <use href="#eye" fill="none" stroke="#1689e8" stroke-width="17" stroke-linejoin="round"/>
</svg>
