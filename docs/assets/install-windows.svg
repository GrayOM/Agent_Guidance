<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660">
  <rect width="1440" height="660" rx="18" fill="#012456"/>
  <rect width="1440" height="54" rx="18" fill="#0b3267"/>
  <text x="30" y="35" fill="#f0f6fc" font-family="Segoe UI, sans-serif" font-size="19">Windows PowerShell — GrayOM virtual environment installation</text>
  <g font-family="Cascadia Mono, DejaVu Sans Mono, monospace" font-size="23">
    <text x="30" y="106" fill="#f9f1a5">PS C:\tools&gt;</text><text x="214" y="106" fill="#f0f6fc"> git clone https://github.com/GrayOM/Agent_Guidance.git</text>
    <text x="30" y="155" fill="#f9f1a5">PS C:\tools&gt;</text><text x="214" y="155" fill="#f0f6fc"> cd .\Agent_Guidance</text>
    <text x="30" y="204" fill="#f9f1a5">PS ...&gt;</text><text x="164" y="204" fill="#f0f6fc"> py -3.11 -m venv .venv</text>
    <text x="30" y="253" fill="#f9f1a5">PS ...&gt;</text><text x="164" y="253" fill="#f0f6fc"> .\.venv\Scripts\Activate.ps1</text>
    <text x="30" y="302" fill="#f9f1a5">(.venv) PS ...&gt;</text><text x="272" y="302" fill="#f0f6fc"> python -m pip install .</text>
    <text x="30" y="351" fill="#b5cea8">Successfully installed grayom-agent-guidance-0.1.0</text>
    <text x="30" y="416" fill="#f9f1a5">(.venv) PS ...&gt;</text><text x="272" y="416" fill="#f0f6fc"> grayom --version</text>
    <text x="30" y="465" fill="#3bdbff">GrayOM Agent Guidance 0.1.0</text>
    <text x="30" y="530" fill="#f9f1a5">(.venv) PS ...&gt;</text><text x="272" y="530" fill="#f0f6fc"> grayom</text>
    <text x="30" y="579" fill="#b5cea8">Detected Agents:  ✓ Codex   ✗ Claude Code</text>
    <text x="30" y="622" fill="#dcdcaa">Select “Setup Agent Environment” to continue.</text>
  </g>
</svg>
