[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grayom-agent-guidance"
dynamic = ["version"]
description = "CLI manager for AI Agent skills, MCP servers, and plugins"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GrayOM" }]
keywords = ["ai-agent", "mcp", "codex", "claude-code", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "InquirerPy>=0.3.4,<1",
  "pydantic>=2.7,<3",
  "httpx[socks]>=0.27,<1",
  "PyYAML>=6.0,<7",
  "tomlkit>=0.13,<1",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.7,<2",
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[project.scripts]
grayom = "grayom_agent_guidance.cli.main:app"

[project.urls]
Homepage = "https://github.com/GrayOM/Agent_Guidance"
Repository = "https://github.com/GrayOM/Agent_Guidance"
Issues = "https://github.com/GrayOM/Agent_Guidance/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/grayom_agent_guidance"]

[tool.hatch.version]
path = "src/grayom_agent_guidance/__init__.py"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
