[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "agent-guidance"
# readme is dynamic because the published description needs absolute links; see the
# fancy-pypi-readme hook below. The file itself stays relative, which is what GitHub and a
# local checkout want.
dynamic = ["version", "readme"]
description = "CLI manager for AI Agent skills, MCP servers, and plugins"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GrayOM" }]
keywords = ["ai-agent", "mcp", "codex", "claude-code", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "InquirerPy>=0.3.4,<1",
  "pydantic>=2.7,<3",
  "httpx[socks]>=0.27,<1",
  "PyYAML>=6.0,<7",
  "tomlkit>=0.13,<1",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.7,<2",
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]
# scripts/capture_screens.py only. It drives the real CLI through a pty and needs a VT100
# emulator to read back the screen; nothing the installed program does requires it.
docs = [
  "pyte>=0.8,<0.9",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[project.scripts]
agent-guidance = "agent_guidance.cli.main:app"

[project.urls]
Homepage = "https://github.com/GrayOM/Agent_Guidance"
Repository = "https://github.com/GrayOM/Agent_Guidance"
Issues = "https://github.com/GrayOM/Agent_Guidance/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_guidance"]

[tool.hatch.version]
path = "src/agent_guidance/__init__.py"

# README.md refers to its screenshots and to the other documents by relative path, which is
# correct in a checkout and on GitHub and broken on PyPI, where there is no repository to
# resolve them against. Published as-is, the project page would have shown eight broken
# images — the logo and every screenshot, which are the point of that page — and five links
# that 404.
#
# So the published description is the same file with those paths made absolute. The file is
# not rewritten: a reader of the repository should not be sent to raw.githubusercontent.com
# to see a picture that is sitting next to the README.
#
# The URLs point at `main` rather than at the tag. An old release's page therefore shows the
# current screenshots, which is a small inaccuracy accepted in exchange for not having to
# rewrite these on every release — and the screenshots are regenerated from the CLI anyway.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'src="docs/'
replacement = 'src="https://raw.githubusercontent.com/GrayOM/Agent_Guidance/main/docs/'

# Markdown links to files in the repository. The negative lookahead leaves anything already
# absolute alone, and leaves in-page anchors alone, which would otherwise be sent to GitHub
# as a path.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?:|#)([^)]+)\)'
replacement = '](https://github.com/GrayOM/Agent_Guidance/blob/main/\1)'

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
