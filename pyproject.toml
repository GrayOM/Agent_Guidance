[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grayom-agent-guidance"
version = "0.1.0"
description = "CLI manager for AI Agent skills, MCP servers, and plugins"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "InquirerPy>=0.3.4,<1",
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[project.scripts]
grayom = "grayom_agent_guidance.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/grayom_agent_guidance"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

