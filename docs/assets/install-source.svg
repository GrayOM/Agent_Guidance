<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660">
  <rect width="1440" height="660" rx="18" fill="#0d1117"/>
  <rect width="1440" height="54" rx="18" fill="#161b22"/>
  <circle cx="30" cy="27" r="8" fill="#ff5f57"/><circle cx="56" cy="27" r="8" fill="#febc2e"/><circle cx="82" cy="27" r="8" fill="#28c840"/>
  <text x="720" y="34" text-anchor="middle" fill="#8b949e" font-family="DejaVu Sans Mono, monospace" font-size="18">GrayOM installation — source / pipx</text>
  <g font-family="DejaVu Sans Mono, monospace" font-size="24">
    <text x="34" y="105" fill="#7ee787">$</text><text x="64" y="105" fill="#f0f6fc">git clone https://github.com/GrayOM/Agent_Guidance.git</text>
    <text x="34" y="148" fill="#8b949e">Cloning into 'Agent_Guidance'...</text>
    <text x="34" y="191" fill="#8b949e">Receiving objects: 100%, done.</text>
    <text x="34" y="250" fill="#7ee787">$</text><text x="64" y="250" fill="#f0f6fc">cd Agent_Guidance</text>
    <text x="34" y="309" fill="#7ee787">$</text><text x="64" y="309" fill="#f0f6fc">pipx install .</text>
    <text x="34" y="352" fill="#8b949e">creating virtual environment...</text>
    <text x="34" y="395" fill="#8b949e">installing grayom-agent-guidance from spec '.'...</text>
    <text x="34" y="438" fill="#7ee787">done! installed package grayom-agent-guidance 0.1.0rc1</text>
    <text x="34" y="497" fill="#7ee787">$</text><text x="64" y="497" fill="#f0f6fc">grayom --version</text>
    <text x="34" y="540" fill="#79c0ff">GrayOM Agent Guidance 0.1.0rc1</text>
    <text x="34" y="599" fill="#7ee787">$</text><text x="64" y="599" fill="#f0f6fc">grayom setup --dry-run</text>
  </g>
</svg>
