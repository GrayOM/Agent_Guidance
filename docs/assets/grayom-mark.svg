<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-label="GrayOM Agent Guidance">
  <title>GrayOM Agent Guidance</title>
  <!-- An eye whose iris is a scanner reticle: concentric rings, a broken outer arc and a ring
       of ticks. The reticle is what keeps this from reading as nmap's eye, which is why an
       earlier plain one was withdrawn.

       The dark card is deliberate and was asked for: this reads as an app mark rather than a
       line drawing, and the green holds its glow against it the way it does in the reference.
       It does mean the mark brings its own background to a light page instead of sitting on it.

       Deliberately plain SVG. No defs, no gradients, no clipPath and no use element, so there
       is no internal reference for a renderer to resolve, and nothing is fetched. The reticle
       is sized to sit inside the lid rather than being clipped to it.

       Note for anyone editing this comment: XML forbids a double hyphen inside a comment, and
       a version of this file shipped with one. Chromium parses SVG leniently and rendered it,
       which is why every browser check passed while GitHub refused the file outright.
       tests/test_assets.py parses every SVG in this directory with a strict parser. -->
  <rect width="240" height="240" rx="40" fill="#06120c"/>
  <path d="M 129.7 64.9 A 56 56 0 0 1 175.1 110.3" fill="none" stroke="#4bf0a0" stroke-width="5" stroke-linecap="round"/>
  <path d="M 175.1 129.7 A 56 56 0 0 1 129.7 175.1" fill="none" stroke="#4bf0a0" stroke-width="5" stroke-linecap="round"/>
  <path d="M 110.3 175.1 A 56 56 0 0 1 64.9 129.7" fill="none" stroke="#4bf0a0" stroke-width="5" stroke-linecap="round"/>
  <path d="M 64.9 110.3 A 56 56 0 0 1 110.3 64.9" fill="none" stroke="#4bf0a0" stroke-width="5" stroke-linecap="round"/>
  <circle cx="120" cy="120" r="45" fill="none" stroke="#4bf0a0" stroke-width="2.5"/>
  <line x1="157.3" y1="127.3" x2="163.2" y2="128.4" stroke="#4bf0a0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="151.7" y1="141.0" x2="156.7" y2="144.3" stroke="#4bf0a0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="141.2" y1="151.5" x2="144.6" y2="156.5" stroke="#4bf0a0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="127.6" y1="157.2" x2="128.8" y2="163.1" stroke="#4bf0a0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="112.7" y1="157.3" x2="111.6" y2="163.2" stroke="#4bf0a0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="99.0" y1="151.7" x2="95.7" y2="156.7" stroke="#4bf0a0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="88.5" y1="141.2" x2="83.5" y2="144.6" stroke="#4bf0a0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="82.8" y1="127.6" x2="76.9" y2="128.8" stroke="#4bf0a0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="82.7" y1="112.7" x2="76.8" y2="111.6" stroke="#4bf0a0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="88.3" y1="99.0" x2="83.3" y2="95.7" stroke="#4bf0a0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="98.8" y1="88.5" x2="95.4" y2="83.5" stroke="#4bf0a0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="112.4" y1="82.8" x2="111.2" y2="76.9" stroke="#4bf0a0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="127.3" y1="82.7" x2="128.4" y2="76.8" stroke="#4bf0a0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="141.0" y1="88.3" x2="144.3" y2="83.3" stroke="#4bf0a0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="151.5" y1="98.8" x2="156.5" y2="95.4" stroke="#4bf0a0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="157.2" y1="112.4" x2="163.1" y2="111.2" stroke="#4bf0a0" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="120" cy="120" r="30" fill="none" stroke="#1de37a" stroke-width="6"/>
  <circle cx="120" cy="120" r="14" fill="#eafff4"/>
  <path d="M 24 120 C 80 28 160 28 216 120 C 160 202 80 202 24 120 Z" fill="none" stroke="#1de37a" stroke-width="13" stroke-linejoin="round"/>
</svg>
